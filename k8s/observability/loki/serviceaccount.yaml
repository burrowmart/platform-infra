# IRSA — grants Loki read/write/delete on the chunk bucket without static AWS
# keys. role-arn is terraform's loki_chunks_role_arn output; replace
# ACCOUNT_ID before applying to a real cluster. Inert (and unused) against
# kind, where Loki authenticates to MinIO with the static credentials in
# ../minio.yaml instead — kind has no OIDC federation to grant IRSA against.
#
# Unlike the OPA bundle bucket's split reader/writer pair, this is one role:
# Loki writes chunks, reads them back for queries, and deletes them when the
# compactor enforces retention — all the same principal.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: observability
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/loki-chunks-irsa"

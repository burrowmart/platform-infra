# DNS name every service's OTEL_EXPORTER_OTLP_ENDPOINT points at
# (otel-collector.observability.svc.cluster.local:4317 — see each service's
# helm/values.yaml).
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8888
      targetPort: 8888

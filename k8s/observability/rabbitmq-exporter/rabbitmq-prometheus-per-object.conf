# rabbitmq_prometheus (enabled via enabled_plugins) exposes only aggregated
# cluster-wide totals by default -- rabbitmq_queue_messages with no `queue`
# label at all. The saga-health dashboard's DLQ-depth-by-queue panel needs
# the per-queue breakdown, which is an explicit opt-in (off by default
# because it's costly on clusters with very many queues -- a non-issue at
# this demo's scale). Loaded automatically by the official RabbitMQ image
# from /etc/rabbitmq/conf.d/*.conf.
prometheus.return_per_object_metrics = true

# Single-binary Tempo, local-disk storage — shared verbatim between the k8s
# ConfigMap and the Compose observability profile, same reasoning as
# ../loki/loki-config.yaml (no environment-specific hostnames or topology
# in here; only the OTel Collector's exporter target differs per environment
# and that lives in otel-collector's own config, not this one).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

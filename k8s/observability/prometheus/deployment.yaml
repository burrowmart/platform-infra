apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Demo-scale retention — short enough that the emptyDir below
            # never grows unreasonably; bump both if this outlives a demo.
            - --storage.tsdb.retention.time=7d
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: storage
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        # emptyDir, not a PVC: 7-day retention on demo-scale traffic fits
        # comfortably in ephemeral node storage, and it avoids a second PVC
        # (beyond Loki's and Tempo's) for what is explicitly a demo cluster.
        # Swap for a PersistentVolumeClaim (mirrors ../loki/pvc.yaml) if this
        # Prometheus needs to survive a pod reschedule.
        - name: storage
          emptyDir: {}

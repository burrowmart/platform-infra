# IRSA — grants the OPA DaemonSet's pods read-only access to the S3 bundle
# bucket without static AWS keys. role-arn is terraform's
# opa_bundle_reader_role_arn output; replace ACCOUNT_ID before applying to a
# real EKS cluster. Inert (and unused) when running against kind — the local
# demo authenticates to MinIO via AWS_ACCESS_KEY_ID/SECRET_ACCESS_KEY env vars
# instead (see configmap.yaml + minio.yaml), since kind has no OIDC federation
# to grant IRSA against.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opa-pdp
  namespace: opa-system
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/opa-bundle-reader-irsa"

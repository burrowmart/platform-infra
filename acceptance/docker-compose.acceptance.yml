# Acceptance-harness overlay — adds notification-service on top of the
# mongo/redis/rabbitmq/order/catalog/payment stack docker-compose.test.yml
# already assembles, so check 6 (unread-count from Redis, rebuildable from
# Mongo) can exercise the real service consuming the real order-confirmed
# events order-service already publishes in that stack. Same container
# pattern (build context, restart: "no", AUTH_DISABLED) docker-compose.test.yml
# established for the other three saga participants.
#
# Usage (from platform-infra/, mirrors integration-tests/package.json's compose:up):
#   docker compose -f docker-compose.yml -f docker-compose.test.yml \
#     -f acceptance/docker-compose.acceptance.yml up -d --build

services:
  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
    container_name: notification-service-it
    restart: "no"
    ports:
      - "4004:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGO_URI: "mongodb://mongo:27017/notifications_it?replicaSet=rs0"
      AUTH_DISABLED: "true"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      REDIS_URL: "redis://redis:6379"
      OUTBOX_PUBLISHER_ENABLED: "true"
      OTEL_SERVICE_NAME: notification-service

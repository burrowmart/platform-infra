# DEMO-ONLY in-cluster substitutes for Mongo/Redis/RabbitMQ — mirrors
# platform-infra/docker-compose.yml's images/settings exactly (same replSet
# rs0 requirement for the outbox's change-stream watcher). In prod these are
# managed services reached from the cluster, not deployed here.
apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          args: ["--replSet", "rs0", "--bind_ip_all"]
          ports: [{ containerPort: 27017 }]
          env:
            # The Service DNS name (mongo.data.svc.cluster.local) can't be
            # used as the replica-set member host here: kube-proxy only
            # routes a Service to pods already marked Ready, so a pod trying
            # to reach itself through the Service during its OWN readiness
            # probe (which is what determines readiness) gets connection
            # refused — a chicken-and-egg problem. rs.initiate()'s "isSelf"
            # check confirmed this by failing with exactly that. The pod's
            # own IP has no such bootstrapping problem, at the cost of not
            # surviving a pod reschedule — acceptable for this demo, where
            # there's exactly one mongo pod for the cluster's lifetime.
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  mongosh --quiet --eval
                  "try { var s=rs.status(); if(s.myState===1) quit(0); quit(1); }
                  catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'$MY_POD_IP:27017'}]}); quit(1); }"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: data
spec:
  selector: { app: mongo }
  ports: [{ port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
# rabbitmq_prometheus is RabbitMQ's own built-in Prometheus exporter
# (bundled since 3.8, ships in this image, just needs enabling) — chosen
# over deploying a third-party rabbitmq_exporter container because it needs
# no extra pod, stays in lockstep with the broker's own version, and is
# the modern upstream-recommended way to get RabbitMQ metrics. It's what
# platform-infra/k8s/observability/prometheus/prometheus.yml means by
# "the rabbitmq exporter" — see
# platform-infra/k8s/observability/rabbitmq-exporter/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-enabled-plugins
  namespace: data
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
---
# rabbitmq_prometheus exposes only aggregated cluster-wide totals unless
# per-object metrics are explicitly opted into -- without this, the
# saga-health dashboard's DLQ-depth-by-queue panel would query a metric
# that carries no `queue` label at all. See
# ../k8s/observability/rabbitmq-exporter/rabbitmq-prometheus-per-object.conf
# (same content, mounted here as a k8s ConfigMap and in Compose as a bind
# mount -- one source of truth, two mount mechanisms).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-prometheus-config
  namespace: data
data:
  rabbitmq.conf: |
    prometheus.return_per_object_metrics = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      # app.kubernetes.io/name (not just `app`) so this pod's `service` label
      # in Prometheus matches the same convention every other scraped pod
      # uses (see ../k8s/observability/prometheus/prometheus.yml).
      labels: { app: rabbitmq, app.kubernetes.io/name: rabbitmq }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15692"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: guest }
            - { name: RABBITMQ_DEFAULT_PASS, value: guest }
          ports:
            - { containerPort: 5672 }
            - { containerPort: 15672 }
            - { containerPort: 15692 } # rabbitmq_prometheus
          volumeMounts:
            - name: enabled-plugins
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
            # Mounted straight to rabbitmq.conf (not conf.d/*.conf) — the
            # plain community image's entrypoint only guarantees loading
            # that one path; conf.d auto-inclusion is a RabbitMQ Cluster
            # Operator convention, not something this base image does.
            - name: prometheus-config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: enabled-plugins
          configMap:
            name: rabbitmq-enabled-plugins
        - name: prometheus-config
          configMap:
            name: rabbitmq-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: data
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: mgmt, port: 15672, targetPort: 15672 }
    - { name: metrics, port: 15692, targetPort: 15692 }

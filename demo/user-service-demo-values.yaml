# Overrides for the kind demo — the base user-service/helm/values.yaml stays
# the production shape (ESO/IRSA/Secrets Manager); this file replaces just
# what kind can't provide.
base-service:
  image:
    repository: archtenet/user-service
    tag: dev
    pullPolicy: IfNotPresent

  replicaCount: 1

  app:
    env:
      NODE_ENV: production
      PORT: "3000"
      # No Cognito pool in kind — same escape hatch integration-tests already
      # use (platform-infra/docker-compose.test.yml). The OPA/Envoy layer is
      # what this demo actually exercises; see bundle/envoy.rego.
      AUTH_DISABLED: "true"
      OUTBOX_PUBLISHER_ENABLED: "true"
      OTEL_SERVICE_NAME: user-service
      MONGO_URI: "mongodb://mongo.data.svc.cluster.local:27017/user-service?replicaSet=rs0"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq.data.svc.cluster.local:5672"
      REDIS_URL: "redis://redis.data.svc.cluster.local:6379"

  # opaAddress left at its chart default (opa-pdp.opa-system.svc.cluster.local:9191)
  # — that's exactly what ../k8s/opa/service.yaml creates, no override needed.

  autoscaling:
    minReplicas: 1
    maxReplicas: 1
  podDisruptionBudget:
    minAvailable: 0

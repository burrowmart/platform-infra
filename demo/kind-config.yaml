# Laptop cluster definition:  kind create cluster --name archtenet --config demo/kind-config.yaml
#
# The two blocks below exist only so ingress-nginx can be reached from the
# host. Neither can be added to a running cluster — changing this file means
# `kind delete cluster` and recreating it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # ingress-nginx is pinned to this node by a nodeSelector (see
      # docs/LOCAL-DEPLOYMENT.md step 6). On a one-node cluster that is
      # cosmetic, but it keeps the install command identical to the
      # multi-node recipe.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # host 8081 -> node 80. 8080 is deliberately avoided: Docker Desktop
      # binds it, and a `kubectl port-forward` on 8080 is the usual way to
      # reach a service's Envoy sidecar — a collision there produces a
      # confusing 403 from the wrong process rather than an obvious error.
      - containerPort: 80
        hostPort: 8081
        protocol: TCP

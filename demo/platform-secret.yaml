# ---------------------------------------------------------------------------
# The local stand-in for what External Secrets Operator syncs out of AWS.
#
# Same shape, same env var names, same delivery mechanism (envFrom → secretRef)
# — only the source differs. That is on purpose: nothing in the service code or
# the Helm chart has to know which environment it is in.
#
# MONGO_URI is NOT here: each service owns its own database, so it is set
# per-service at install time (see docs/LOCAL-DEPLOYMENT.md).
#
# stringData, not data: plain text, no base64 to hand-encode. Fine here — these
# are addresses inside a laptop cluster, plus dev-only placeholder secrets that
# grant nothing outside it. Never reuse these values anywhere real.
#
#   kubectl apply -n local -f platform-infra/demo/platform-secret.yaml
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: platform-local
type: Opaque
stringData:
  REDIS_URL: "redis://redis.data.svc.cluster.local:6379"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.data.svc.cluster.local:5672"
  # ws-gateway signs its WebSocket handshake ticket with this (Joi: min 16
  # chars, required even when AUTH_DISABLED=true — the WS upgrade has no other
  # guard). In AWS this comes from Secrets Manager; this is the local stand-in.
  WS_TICKET_SECRET: "dev-only-secret-change-me-please"

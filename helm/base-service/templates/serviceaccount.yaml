apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "base-service.fullname" . }}
  labels:
    {{- include "base-service.labels" . | nindent 4 }}
  {{- if .Values.irsaRoleArn }}
  annotations:
    # Kept for parity with EKS (and so the same chart works unchanged if this
    # ever moves back onto EKS). On this k3s cluster the annotation is
    # informational only — nothing reads it, because there is no pod-identity
    # webhook. What actually grants AWS access is the projected
    # sts.amazonaws.com token and the AWS_* env vars the Deployment sets.
    eks.amazonaws.com/role-arn: {{ .Values.irsaRoleArn | quote }}
  {{- end }}
automountServiceAccountToken: true

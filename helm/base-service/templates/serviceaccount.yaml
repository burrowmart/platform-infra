apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "base-service.fullname" . }}
  labels:
    {{- include "base-service.labels" . | nindent 4 }}
  annotations:
    # IRSA: EKS projects this ServiceAccount's identity to the IAM role so the pod
    # can call AWS APIs (Secrets Manager, etc.) without static credentials
    eks.amazonaws.com/role-arn: {{ .Values.irsaRoleArn | quote }}
automountServiceAccountToken: true

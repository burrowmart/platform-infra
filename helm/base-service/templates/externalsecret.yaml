apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "base-service.fullname" . }}
  labels:
    {{- include "base-service.labels" . | nindent 4 }}
spec:
  # Re-sync every hour; set to a shorter interval for fast secret rotation
  refreshInterval: 1h
  secretStoreRef:
    # ClusterSecretStore named 'aws-secrets-manager' must be pre-provisioned
    # (typically via platform-infra Terraform; it uses IRSA credentials)
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ include "base-service.fullname" . }}
    # Owner policy: ESO deletes the k8s Secret when the ExternalSecret is deleted
    creationPolicy: Owner
  dataFrom:
    # Extract all keys from the Secrets Manager JSON document into the k8s Secret
    - extract:
        key: {{ .Values.secretsManagerPath | quote }}

{{- /*
Rendered only when externalSecrets.enabled. Off locally: External Secrets
Operator and its CRDs aren't installed on a laptop cluster, and there is no
AWS to sync from — local values supply the same env vars directly instead.
*/ -}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "base-service.fullname" . }}
  labels:
    {{- include "base-service.labels" . | nindent 4 }}
spec:
  # Re-sync every hour; set to a shorter interval for fast secret rotation
  refreshInterval: 1h
  secretStoreRef:
    # ClusterSecretStore must be pre-provisioned and configured for the same
    # backend the terraform secrets module wrote to:
    #   secrets_backend = "ssm"            -> provider aws, service: ParameterStore
    #   secrets_backend = "secretsmanager" -> provider aws, service: SecretsManager
    # It authenticates with the IRSA role, i.e. jwt auth against the cluster's
    # OIDC discovery bucket — no static credentials.
    name: {{ .Values.secretStoreName | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ include "base-service.fullname" . }}
    # Owner policy: ESO deletes the k8s Secret when the ExternalSecret is deleted
    creationPolicy: Owner
  dataFrom:
    # The terraform secrets module writes one entry per key under
    # <prefix>/<service>/, not a single JSON document — so this discovers the
    # whole path rather than extracting one blob.
    - find:
        path: {{ .Values.secretsManagerPath | quote }}
        name:
          regexp: ".*"
      rewrite:
        # <path>/mongo-uri -> mongo-uri
        - regexp:
            source: '.*/([^/]+)$'
            target: '$1'
        # mongo-uri -> MONGO_URI. Required: envFrom silently drops any key
        # that isn't a valid C identifier, so a hyphenated key would leave the
        # app with the env var simply missing.
        - transform:
            template: {{ `'{{ .value | upper | replace "-" "_" }}'` }}
{{- end }}

{{- /*
Off locally: with replicaCount 1, a minAvailable of 1 blocks the eviction
that a rolling update needs, and `helm upgrade` hangs instead of failing.
*/ -}}
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "base-service.fullname" . }}
  labels:
    {{- include "base-service.labels" . | nindent 4 }}
spec:
  # Guarantees availability during voluntary disruptions (node drain, rolling deploys)
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "base-service.selectorLabels" . | nindent 6 }}
{{- end }}

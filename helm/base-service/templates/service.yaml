apiVersion: v1
kind: Service
metadata:
  name: {{ include "base-service.fullname" . }}
  labels:
    {{- include "base-service.labels" . | nindent 4 }}
spec:
  # ClusterIP is mandatory; Cloudflare Tunnel is the only external entry point.
  # LoadBalancer and NodePort are explicitly forbidden by platform policy.
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      # Normally routes to envoy-pep (:8080) so every request is authorized
      # before it reaches the app. With the sidecar disabled (local dev) there
      # is nothing in front, so the Service targets the app port directly.
      targetPort: {{ if .Values.envoy.enabled }}http-envoy{{ else }}http-app{{ end }}
      protocol: TCP
      name: http
  selector:
    {{- include "base-service.selectorLabels" . | nindent 4 }}

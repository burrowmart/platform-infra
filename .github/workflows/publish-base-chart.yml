# Publishes helm/base-service to ghcr.io as an OCI artifact.
#
# This is what makes the polyrepo split work. Each service repo declares
# base-service as a dependency but has no sibling platform-infra checkout in
# CI, so it resolves the chart from here with `helm dependency update`.
#
# The alternative — committing the packaged .tgz into every service repo —
# was what this replaced. It worked, but a chart edit silently did nothing
# until all twelve tarballs were rebuilt and committed, and Chart.lock could
# not detect the drift (its digest covers the dependency list, not the chart
# contents).

name: Publish base-service chart

on:
  push:
    branches: [main]
    paths:
      - "helm/base-service/**"
      - ".github/workflows/publish-base-chart.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push an OCI artifact to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.0"

      - name: Read chart version
        id: chart
        run: |
          VERSION="$(awk '/^version:/ {print $2}' helm/base-service/Chart.yaml)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Chart version: ${VERSION}"

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Refuse to overwrite. Without this, re-publishing the same version
      # would reintroduce exactly the problem this workflow exists to remove:
      # consumers pinning "0.1.0" and silently getting different content over
      # time. Bump version: in helm/base-service/Chart.yaml with every change.
      - name: Fail if this version is already published
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          if helm show chart "oci://ghcr.io/${OWNER}/charts/base-service" \
               --version "${VERSION}" >/dev/null 2>&1; then
            echo "::error::base-service ${VERSION} is already published." \
                 "Bump 'version:' in helm/base-service/Chart.yaml."
            exit 1
          fi
          echo "${VERSION} is not published yet — proceeding."

      - name: Lint
        run: helm lint helm/base-service

      - name: Package and push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          helm package helm/base-service -d dist/
          helm push "dist/base-service-${{ steps.chart.outputs.version }}.tgz" \
            "oci://ghcr.io/${OWNER}/charts"

      - name: Remind about consumers
        run: |
          echo "Published base-service ${{ steps.chart.outputs.version }}."
          echo "Each service repo must bump the dependency version in its"
          echo "helm/Chart.yaml and commit the regenerated helm/Chart.lock."

# Reusable CI pipeline for every archtenet microservice.
# Called from a service repo's .github/workflows/ci.yml via workflow_call.
#
# Stages (sequential): lint → test → build → docker-push → security-scan → deploy
#
# No long-lived AWS credentials: the deploy job uses GitHub OIDC to assume an
# AWS IAM role (trust policy must allow the repo's OIDC subject).

name: Service CI

on:
  workflow_call:
    inputs:
      service-name:
        description: "Kubernetes release name and image name (e.g. user-service)"
        required: true
        type: string
      helm-path:
        description: "Path to the service Helm chart directory (e.g. ./helm)"
        required: true
        type: string
    secrets:
      SNYK_TOKEN:
        description: "Snyk authentication token for container vulnerability scanning"
        required: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint — ESLint + tsc type-check
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run build --if-present  # catches type errors early

  # ---------------------------------------------------------------------------
  # 2. Test — unit + e2e
  # Service containers provide real Mongo/Redis/RabbitMQ so e2e tests don't mock.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/test
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://localhost:5672
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: E2E tests
        run: npm run test:e2e

  # ---------------------------------------------------------------------------
  # 3. Build — compile TypeScript, verify no compile errors
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      # Cache the dist/ output so the Docker job can COPY it without rebuilding
      - uses: actions/cache/save@v4
        with:
          path: dist
          key: dist-${{ github.sha }}

  # ---------------------------------------------------------------------------
  # 4. Docker — build image and push to ghcr.io with git-SHA tag
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write  # required to push to ghcr.io
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
      image-ref: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: dist
          key: dist-${{ github.sha }}

      - name: Compute image ref
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ inputs.service-name }}
        run: |
          TAG="sha-${GITHUB_SHA}"
          REF="ghcr.io/${OWNER}/${SERVICE}:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
          # Inline cache to ghcr.io speeds up future builds on the same branch
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 5. Security scan — Trivy (SARIF uploaded to GitHub Security) + Snyk
  # ---------------------------------------------------------------------------
  security-scan:
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      security-events: write  # required to upload SARIF results
    steps:
      - uses: actions/checkout@v4

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.docker.outputs.image-ref }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()  # upload even when Trivy finds issues so they appear in the UI
        with:
          sarif_file: trivy-results.sarif

      - name: Snyk container scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          IMAGE_REF: ${{ needs.docker.outputs.image-ref }}
        run: |
          npm install --global snyk
          snyk container test "$IMAGE_REF" --severity-threshold=high

  # ---------------------------------------------------------------------------
  # 6. Deploy — GitHub OIDC → AWS assume-role → update-kubeconfig → helm upgrade
  # No static AWS keys; role trust policy must allow the calling repo's OIDC subject.
  # ---------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    # needs both to gate on security pass AND to read image-tag output from docker
    needs: [docker, security-scan]
    permissions:
      id-token: write  # required for GitHub OIDC token exchange
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC (no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubectl for EKS
        env:
          CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.0"

      - name: Helm upgrade --install
        env:
          SERVICE_NAME: ${{ inputs.service-name }}
          HELM_PATH: ${{ inputs.helm-path }}
          IMAGE_TAG: ${{ needs.docker.outputs.image-tag }}
        run: |
          helm upgrade --install "$SERVICE_NAME" "$HELM_PATH" \
            --set "image.tag=${IMAGE_TAG}" \
            --namespace "$SERVICE_NAME" \
            --create-namespace \
            --atomic \
            --timeout 10m
